<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💖</title>

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  background:linear-gradient(135deg,#ff9acb,#ffc1dc,#ffd6e8);
  font-family:Arial,sans-serif;
}

.container{
  position:absolute;
  top:35%;
  width:100%;
  text-align:center;
  padding:0 10px;
  z-index:5;
}

h1{
  color:white;
  font-size:clamp(2rem,6vw,3rem);
  text-shadow:0 0 15px hotpink;
}

button{
  padding:14px 32px;
  font-size:clamp(16px,4vw,20px);
  border:none;
  border-radius:40px;
  cursor:pointer;
  transition:.2s ease;
}

#yes{
  background:#ff4fa3;
  color:white;
  box-shadow:0 0 18px #ff4fa3;
}

#no{
  background:white;
  color:#ff4fa3;
  position:absolute;
}

/* parallax hearts */
.layer1{animation-duration:14s;}
.layer2{animation-duration:10s;}
.layer3{animation-duration:7s;}

.heart{
  position:absolute;
  opacity:.85;
  animation-name:float;
  animation-timing-function:linear;
  animation-iteration-count:infinite;
  will-change:transform;
}

@keyframes float{
  from{transform:translateY(110vh) scale(.8);}
  to{transform:translateY(-15vh) scale(1.6);}
}

/* explosion */
.explosion{
  position:absolute;
  animation:burst .9s ease-out forwards;
}

@keyframes burst{
  to{
    transform:translate(var(--x),var(--y)) scale(.2);
    opacity:0;
  }
}

/* flash */
.flash{
  position:fixed;
  inset:0;
  background:white;
  animation:flash .35s ease-out;
}

@keyframes flash{
  40%{opacity:.85;}
  100%{opacity:0;}
}

/* message */
.message{
  padding:24px;
  font-size:clamp(1.1rem,4vw,1.8rem);
  color:white;
  text-shadow:0 0 12px hotpink;
  max-width:900px;
  animation:popIn .9s ease-out forwards,heartbeat 2.8s ease-in-out infinite;
}

@keyframes popIn{
  0%{transform:scale(0);opacity:0;}
  70%{transform:scale(1.1);}
  100%{transform:scale(1);opacity:1;}
}

@keyframes heartbeat{
  50%{transform:scale(1.025);}
}

/* glitter */
.glitter{
  position:absolute;
  animation:glitterFall 5s linear forwards;
}

@keyframes glitterFall{
  from{transform:translateY(-10vh);}
  to{transform:translateY(110vh);opacity:0;}
}

/* cute kitty */
.kitty{
  position:fixed;
  bottom:10px;
  right:10px;
  font-size:60px;
  animation:wave 2s ease-in-out infinite;
  z-index:10;
}

@keyframes wave{
  50%{transform:rotate(10deg) scale(1.05);}
}
</style>
</head>

<body>

<div class="kitty">🐱🎀</div>

<div class="container">
<h1>Arushi, will you be my Valentine? 💖</h1>
<button id="yes">Yes 💕</button>
<button id="no">No 🙄</button>
</div>

<script>
const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const isMobile=window.innerWidth<768;

/* preload (warm up animations) */
function preload(){
  for(let i=0;i<10;i++){
    const h=document.createElement("div");
    h.className="explosion";
    document.body.appendChild(h);
    h.remove();
  }
}
preload();

/* escape button */
function moveNo(){
  noBtn.style.left=Math.random()*(window.innerWidth-120)+"px";
  noBtn.style.top=Math.random()*(window.innerHeight-120)+"px";
}
noBtn.addEventListener("mouseenter",moveNo);
noBtn.addEventListener("touchstart",moveNo);

/* parallax hearts */
function spawnHeart(layer){
  const h=document.createElement("div");
  h.className="heart layer"+layer;
  h.innerHTML="💖";
  h.style.left=Math.random()*100+"vw";
  h.style.fontSize=Math.random()*12+14+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),15000);
}

setInterval(()=>spawnHeart(1), isMobile?900:600);
setInterval(()=>spawnHeart(2), isMobile?700:400);
setInterval(()=>spawnHeart(3), isMobile?500:300);

/* burst */
function explode(x,y){
  const count=isMobile?28:50;
  for(let i=0;i<count;i++){
    const h=document.createElement("div");
    h.className="explosion";
    h.innerHTML="💖";
    h.style.left=x+"px";
    h.style.top=y+"px";

    const a=Math.random()*Math.PI*2;
    const d=Math.random()*(isMobile?260:450)+120;

    h.style.setProperty("--x",Math.cos(a)*d+"px");
    h.style.setProperty("--y",Math.sin(a)*d+"px");

    document.body.appendChild(h);
    setTimeout(()=>h.remove(),900);
  }

  const f=document.createElement("div");
  f.className="flash";
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),350);
}

/* glitter rain */
function startGlitter(){
  setInterval(()=>{
    const g=document.createElement("div");
    g.className="glitter";
    g.innerHTML="✨";
    g.style.left=Math.random()*100+"vw";
    document.body.appendChild(g);
    setTimeout(()=>g.remove(),5000);
  }, isMobile?240:150);
}

yesBtn.addEventListener("click",()=>{
  const cx=window.innerWidth/2;
  const cy=window.innerHeight/2;

  explode(cx,cy);

  setTimeout(()=>{
    document.body.innerHTML=`
    <div style="display:flex;justify-content:center;align-items:center;height:100vh;
    background:linear-gradient(135deg,#ff69b4,#ffc0cb);padding:10px;">
      <div class="message">
      Hiiiii, I love you bohot saara. Ever since we have met, you've been my home, my peace, my family.
      You're a part of me, the best part of me tbh hehe. You're just like my little kid, and I wish you'd be that for life.
      I can't imagine a world without you and like I said — <br><br>
      <i>"jab milta andhera mujhe tu hoti meri moon"</i> ✨<br><br>
      Thank you for being my valentine the best girl that has ever walked this earth 💖  
      I love you ❤️
      </div>
    </div>`;
    startGlitter();
  },420);
});
</script>

</body>
</html>
